독자:
  누구: "AI Agent와 LLM을 함께 공부하는 스터디원들 — 실무에 붙여보려는 개발자"
  이미_아는_것: "LLM API 사용법, 기본적인 AI Agent 개념, 최근 AI 산업 동향에 대한 기본 이해"

중요도_기준:
  - "LLM/AI Agent 기술이 실질적으로 진화했다고 볼 근거가 있는가 (신규 모델·아키텍처·벤치마크 등)"
  - "AI 보안 또는 양자컴퓨터 관련 새로운 위협이나 기술적 진전이 있는가"
  - "국내 대기업·중소기업의 AI 도입 사례나 정책 변화가 실제로 있었는가"
  - "AI를 둘러싼 사회·경제·정치적 이슈로 스터디원들의 관점을 넓힐 만한가"

버릴_것:
  - "발표 예정·로드맵만 있고 지금 확인할 수 없는 것"
  - "MOU·업무협약·투자유치·수상 등 당사자 홍보성 소식"
  - "맥락 없는 단순 주가·시황 숫자 나열"
